name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# One job per platform, and it does what a person does on a new machine:
# bootstrap, install, check that the result works. Nothing in here knows the
# name of a package -- `zig build headless` owns that list, and `zig build
# smoke` owns what "works" means. See zig/smoke.zig.
jobs:
  headless:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - macos-26
          - macos-26-intel
          - macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/zig
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}

      - run: ./bootstrap.sh

      - name: bootstrap again, expecting a no-op
        run: ./bootstrap.sh

      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --summary failures, not all: a 90-line green tree buries the one
      # step that broke thousands of lines above the end of the log.
      - run: zig build headless --summary failures

      # --summary all here: it is four lines, and it turns a silent pass
      # into a visible test tally.
      - run: zig build smoke --summary all
