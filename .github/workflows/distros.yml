name: distros

# push is limited to master: with both triggers unfiltered, every commit
# on a branch with a PR open builds the whole matrix twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: distros-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Containers are driven with `docker run` from an ubuntu runner rather than
# `container:` -- actions/checkout needs a glibc node, which alpine does not
# have, and the point here is to test images that are deliberately bare.
env:
  RUN: >-
    docker run --rm -v ${{ github.workspace }}:/src:ro
    -e SETUP -e SCRIPT -w /

jobs:
  # Which images can run bootstrap.sh with nothing added? This reports rather
  # than asserts: half of these are expected to be missing curl or xz, and a
  # square that is red on purpose is a square nobody reads. The answer lands in
  # the run summary instead.
  bare:
    name: bare images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: what does bootstrap.sh need?
        run: |
          echo "| image | bootstrap.sh as shipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for image in alpine:3.22 debian:13 debian:12 ubuntu:22.04 \
                       fedora:43 archlinux:latest rockylinux/rockylinux:9; do
            if out=$($RUN "$image" sh -euc '
                       cp -a /src /work && cd /work
                       ./bootstrap.sh && "$HOME/.local/bin/zig" version
                     ' 2>&1); then
              note="works"
            else
              note="$(printf '%s' "$out" | grep -Eio '[a-z0-9_-]+: (not found|Cannot exec)' | sort -u | paste -sd' ' -)"
              note="needs: ${note:-see logs}"
            fi
            echo "| \`$image\` | $note |" >> "$GITHUB_STEP_SUMMARY"
            echo "$image: $note"
          done

  # The same thing ci.yml does, on distros GitHub does not offer as a runner.
  # `setup` is the finding: it is the documented floor for that distro, and it
  # grows only when a row here goes red.
  headless:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils gcc libc6-dev passwd
          - image: fedora:43
            setup: dnf install -y tar xz gcc glibc-devel util-linux-user
          - image: rockylinux/rockylinux:9
            setup: dnf install -y tar xz gcc glibc-devel util-linux-user
          # musl, and the answer is now precise: 7 of 8 smoke tests pass.
          #
          # linux-headers is here because libuv wants linux/errqueue.h, which
          # alpine does not ship. With it, everything builds -- neovim, fish,
          # the grammars -- and everything runs except lua-language-server,
          # which fails to spawn at all:
          #
          #   could not run .../bin/lua-language-server: FileNotFound
          #
          # That is a glibc ELF on musl: execve cannot find its interpreter.
          # It is the only dynamically linked thing we install, so it is the
          # only one that can fail this way. zls is fine -- static zig binary,
          # which is why the old "zls and lua-ls are glibc-only" note was half
          # wrong. Fixing it means a musl build of lua-language-server, which
          # upstream does not publish, so the row stays experimental.
          - image: alpine:3.22
            setup: apk add --no-cache ca-certificates tar xz gcc musl-dev linux-headers shadow
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - name: bootstrap, install, smoke test
        env:
          SETUP: ${{ matrix.setup }}
          SCRIPT: |
            ./bootstrap.sh
            ./bootstrap.sh
            export PATH="$HOME/.local/bin:$PATH"
            zig build headless --summary failures
            zig build smoke --summary all
        run: |
          $RUN ${{ matrix.image }} sh -euc '
            cp -a /src /work && cd /work
            eval "$SETUP"
            eval "$SCRIPT"
          '

  # zig bundles clang, lld, musl and headers for 76 targets. If that claim is
  # real, the tree-sitter grammars compile on an image with no gcc, no clang,
  # no make and no pkg-config. This is the load-bearing assumption of the whole
  # repo, so it is the one job that names a package on purpose.
  no-system-compiler:
    name: no cc ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.22
            setup: apk add --no-cache ca-certificates tar xz
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils
    steps:
      - uses: actions/checkout@v5
      - name: prove there is no C toolchain, then build C anyway
        env:
          SETUP: ${{ matrix.setup }}
          SCRIPT: |
            for t in cc gcc clang make cmake pkg-config; do
              command -v $t >/dev/null && { echo "FAIL: $t exists, this image is not bare"; exit 1; }
            done
            echo "no system C toolchain, good"
            ./bootstrap.sh
            export PATH="$HOME/.local/bin:$PATH"
            zig build treesitter --summary all
            ls "$HOME/.local/share/nvim/site/parser/"
        run: |
          $RUN ${{ matrix.image }} sh -euc '
            cp -a /src /work && cd /work
            eval "$SETUP"
            eval "$SCRIPT"
          '
