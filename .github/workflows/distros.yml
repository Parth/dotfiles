name: distros

# push only on master: with both triggers unfiltered, a branch with a PR open
# builds everything twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: distros-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# docker run rather than `container:` -- actions/checkout needs a glibc node,
# which alpine does not have, and these images are deliberately bare.
env:
  RUN: >-
    docker run --rm -v ${{ github.workspace }}:/src:ro
    -e SETUP -e SCRIPT -w /

jobs:
  # Which images run bootstrap.sh with nothing added? Reports rather than
  # asserts: several are expected to lack curl or xz, and a square that is red
  # on purpose is a square nobody reads.
  bare:
    name: bare images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: what does bootstrap.sh need?
        run: |
          images=(
            alpine:3.22
            debian:13
            debian:12
            ubuntu:22.04
            fedora:43
            archlinux:latest
            rockylinux/rockylinux:9
          )

          # Exit status is the verdict; output is only read when it fails.
          bootstrap_in() {
            local image=$1
            docker run --rm -v "$PWD:/src:ro" -w / "$image" sh -euc '
              cp -a /src /work
              cd /work
              ./bootstrap.sh
              "$HOME/.local/bin/zig" version
            ' 2>&1
          }

          # "wget: not found" and "xz: Cannot exec" become "wget xz". grep
          # exits 1 on no match, which means a failure we have no name for --
          # an answer, not an error, so it must not trip `set -e`.
          missing_commands() {
            grep -Eio '[a-z0-9_-]+: (not found|cannot exec)' \
              | cut -d: -f1 \
              | sort -u \
              | paste -sd' ' - \
              || true
          }

          rows=()
          for image in "${images[@]}"; do
            if output=$(bootstrap_in "$image"); then
              verdict='works as shipped'
            else
              missing=$(missing_commands <<<"$output")
              verdict="missing: ${missing:-unclear, read the log}"
            fi

            echo "$image -> $verdict"
            rows+=("| \`$image\` | $verdict |")
          done

          {
            echo '| image | bootstrap.sh as shipped |'
            echo '| --- | --- |'
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same thing ci.yml does, on distros GitHub does not offer as a runner.
  # `setup` is the finding: the documented floor for that distro.
  headless:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils gcc libc6-dev passwd
          - image: fedora:43
            setup: dnf install -y tar xz gcc glibc-devel util-linux-user
          - image: rockylinux/rockylinux:9
            setup: dnf install -y tar xz gcc glibc-devel util-linux-user
    steps:
      - uses: actions/checkout@v5
      - name: bootstrap, install, smoke test
        env:
          SETUP: ${{ matrix.setup }}
          SCRIPT: |
            ./bootstrap.sh
            ./bootstrap.sh
            export PATH="$HOME/.local/bin:$PATH"
            zig build headless --summary failures
            zig build smoke --summary all
        run: |
          $RUN ${{ matrix.image }} sh -euc '
            cp -a /src /work && cd /work
            eval "$SETUP"
            eval "$SCRIPT"
          '

  # zig bundles clang, lld, musl and headers for 76 targets. If that is real,
  # the tree-sitter grammars compile with no gcc, clang, make or pkg-config.
  # The load-bearing claim of the repo, so it gets to name a package.
  no-system-compiler:
    name: no cc ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.22
            setup: apk add --no-cache ca-certificates tar xz
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils
    steps:
      - uses: actions/checkout@v5
      - name: prove there is no C toolchain, then build C anyway
        env:
          SETUP: ${{ matrix.setup }}
          SCRIPT: |
            for t in cc gcc clang make cmake pkg-config; do
              command -v $t >/dev/null && { echo "FAIL: $t exists, this image is not bare"; exit 1; }
            done
            echo "no system C toolchain, good"
            ./bootstrap.sh
            export PATH="$HOME/.local/bin:$PATH"
            zig build treesitter --summary all
            ls "$HOME/.local/share/nvim/site/parser/"
        run: |
          $RUN ${{ matrix.image }} sh -euc '
            cp -a /src /work && cd /work
            eval "$SETUP"
            eval "$SCRIPT"
          '
